name: Import source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ !contains(github.event.head_commit.message, '[source-import]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Abaildaev/threads-automation-students
          ref: 61c1e854d2603b2a4109bf8d9e094d1bbfc3db02
          path: source

      - name: Copy project
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github' source/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[source-import] Import Threads Automation source" || exit 0
          git push
